# Stack de supervision SinistreFlow - à combiner avec docker-compose.yml :
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
# Chemins relatifs à la racine du projet (dossier du premier fichier compose).
#
#   app:/metrics ──┐
#   node-exporter ─┼──> Prometheus ──> Grafana (tableaux de bord)
#   postgres-exp. ─┤        │
#   cadvisor ──────┤        └──> Alertmanager ──> Discord / Slack / mail
#   blackbox ──────┘ (sonde HTTP /health vue "de l'extérieur")

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # accès via tunnel SSH uniquement
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD doit être défini}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    pid: host
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME:-sinistreflow}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-sinistreflow}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
