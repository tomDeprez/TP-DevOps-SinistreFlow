global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # métriques applicatives (RED + métier)
  - job_name: sinistreflow
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
    # si METRICS_TOKEN est défini côté application :
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token

  # santé vue de l'extérieur : /health doit répondre 2xx (503 si la base est KO)
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://app:3000/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
